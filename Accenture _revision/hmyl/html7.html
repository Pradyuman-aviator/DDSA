<!DOCTYPE html>
<html>
<head>
    <title>Accenture Practice</title>

    <style>
        
    </style>
</head>

<body>

    <h2>Choose an option</h2>

    <button class="option">Apple</button>
    <button class="option">Banana</button>
    <button class="option">Mango</button>

    <p id="message">Nothing selected</p>

    <script>
        const btn = document.querySelectorAll('.option')
        const msg = document.querySelector('#message')

        btn.forEach(function(li){
            li.addEventListener('click',function(){
                msg.textContent = 'You selected' + li.textContent;
            })
        })
        
    </script>

</body>
</html>
